<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="356" viewBox="0 0 1280 356" role="img" aria-labelledby="title desc">
  <title id="title">Every application has a clear status.</title>
  <desc id="desc">Fictional tracker. Only submitted applications have an actual submission date.</desc>
  <rect width="1280" height="356" rx="22" fill="#f8fafc" />
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="48" y="52" fill="#0f172a" font-size="28" font-weight="700">Every application has a clear status.</text>
    <text x="48" y="82" fill="#64748b" font-size="15">Your agent helps fill the form. You review and submit. Then update the same record.</text>
    <rect x="1098" y="32" width="134" height="28" rx="14" fill="#e0e7ff" />
    <text x="1165" y="51" text-anchor="middle" fill="#4f46e5" font-size="12">ILLUSTRATION</text>
    <rect x="48" y="106" width="1184" height="204" rx="14" fill="white" stroke="#e2e8f0" />
    <path d="M62 106h1156a14 14 0 0 1 14 14v30H48v-30a14 14 0 0 1 14-14" fill="#eef2ff" />
    <path d="M48 150h1184m-1184 53h1184m-1184 53h1184" stroke="#e2e8f0" />
    <g fill="#475569" font-size="13" font-weight="600"><text x="72" y="134">Company</text><text x="332" y="134">Role</text><text x="752" y="134">Status</text><text x="1032" y="134">Submitted on</text></g>
    <g fill="#1e293b" font-size="15"><text x="72" y="182">Example Tech</text><text x="332" y="182">Software Engineering Intern</text><text x="72" y="235">Example Networks</text><text x="332" y="235">AI Application Engineer</text><text x="72" y="288">Example Data</text><text x="332" y="288">Data Engineer</text></g>
    <rect x="752" y="164" width="140" height="26" rx="13" fill="#f1f5f9" /><text x="822" y="182" text-anchor="middle" fill="#64748b" font-size="13">Filling</text>
    <rect x="752" y="217" width="140" height="26" rx="13" fill="#fef3c7" /><text x="822" y="235" text-anchor="middle" fill="#b45309" font-size="13">Ready to submit</text>
    <rect x="752" y="270" width="140" height="26" rx="13" fill="#dcfce7" /><text x="822" y="288" text-anchor="middle" fill="#15803d" font-size="13">Submitted</text>
    <text x="1032" y="182" fill="#94a3b8" font-size="15">—</text><text x="1032" y="235" fill="#94a3b8" font-size="15">—</text><text x="1032" y="288" fill="#334155" font-size="14">2026-10-20</text>
    <text x="48" y="337" fill="#64748b" font-size="12">Create your tracker once. Keep using it. Continuing or submitting an application updates its existing record.</text>
  </g>
</svg>
