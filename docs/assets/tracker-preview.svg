<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="356" viewBox="0 0 1280 356" role="img" aria-labelledby="title desc">
  <title id="title">每一份申请，都有清楚的状态</title>
  <desc id="desc">虚构的投递表示意。填写中和待提交的申请没有实际投递日期；已投递记录实际日期。</desc>
  <rect width="1280" height="356" rx="22" fill="#f8fafc"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="48" y="52" fill="#0f172a" font-size="28" font-weight="700">每一份申请，都有清楚的状态。</text>
    <text x="48" y="82" fill="#64748b" font-size="15">填表由 AI 协助，检查和提交由你完成；确认提交后更新原记录。</text>
    <rect x="48" y="106" width="1184" height="204" rx="14" fill="white" stroke="#e2e8f0"/>
    <path d="M62 106h1156a14 14 0 0 1 14 14v30H48v-30a14 14 0 0 1 14-14" fill="#eef2ff"/>
    <path d="M48 150h1184m-1184 53h1184m-1184 53h1184" stroke="#e2e8f0"/>
    <g fill="#475569" font-size="13" font-weight="600"><text x="72" y="134">公司名称</text><text x="332" y="134">岗位名称</text><text x="752" y="134">进度</text><text x="1032" y="134">实际投递日期</text></g>
    <g fill="#1e293b" font-size="15"><text x="72" y="182">示例科技</text><text x="332" y="182">软件开发实习生</text><text x="72" y="235">示例网络</text><text x="332" y="235">AI 应用开发工程师</text><text x="72" y="288">示例数据</text><text x="332" y="288">数据开发工程师</text></g>
    <rect x="752" y="164" width="86" height="26" rx="13" fill="#f1f5f9"/><text x="795" y="182" text-anchor="middle" fill="#64748b" font-size="13">填写中</text>
    <rect x="752" y="217" width="86" height="26" rx="13" fill="#fef3c7"/><text x="795" y="235" text-anchor="middle" fill="#b45309" font-size="13">待提交</text>
    <rect x="752" y="270" width="86" height="26" rx="13" fill="#dcfce7"/><text x="795" y="288" text-anchor="middle" fill="#15803d" font-size="13">已投递</text>
    <text x="1032" y="182" fill="#94a3b8" font-size="15">—</text><text x="1032" y="235" fill="#94a3b8" font-size="15">—</text><text x="1032" y="288" fill="#334155" font-size="14">2026-10-20</text>
    <text x="48" y="337" fill="#64748b" font-size="12">首次建表后持续复用；继续填写或确认提交，更新同一条申请。</text>
  </g>
</svg>
